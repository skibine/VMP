# region RELEASE [DOMAIN(8): CI; CONCEPT(8): Release; TECH(9): GitHubActions, GoReleaser]
# @purpose Tag-driven release job: build SPA first (go:embed needs it on disk),
#   then goreleaser cross-compiles 6 artifacts and publishes a GitHub Release.
# GREP_SUMMARY: release, goreleaser, tags, artifacts, npm ci, embed, cross-compile
# STRUCTURE: ▶ push tag v* → checkout(depth=0) → ○ npm ci+build → ⚡ goreleaser release --clean → ⦲ Release
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: "Build SPA (must precede goreleaser: embedded via go:embed)"
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
