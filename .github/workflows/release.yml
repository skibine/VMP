# region RELEASE [DOMAIN(8): CI; CONCEPT(8): Release; TECH(9): GitHubActions, GoReleaser]
# @purpose Tag-driven release job: build SPA first (go:embed needs it on disk),
#   then goreleaser cross-compiles 6 artifacts and publishes a GitHub Release.
# GREP_SUMMARY: release, goreleaser, tags, artifacts, npm ci, embed, cross-compile
# STRUCTURE: ▶ push tag v* → checkout(depth=0) → ○ npm ci+build → ⚡ goreleaser release --clean → ⦲ Release
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: "Build SPA (must precede goreleaser: embedded via go:embed)"
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
