# region CI [DOMAIN(7): CI; CONCEPT(7): Pipeline; TECH(8): GitHubActions]
# @purpose Lint + test on every push/PR. CGO-free build (modernc sqlite) keeps it portable.
# GREP_SUMMARY: ci, github actions, go, test, vet, build
# STRUCTURE: ▶ checkout → ○ setup-go → ⚡ go vet → ⊕ go test → ∑ go build
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Download deps
        run: go mod download
      - name: Format check
        run: |
          out=$(gofmt -l internal cmd)
          if [ -n "$out" ]; then echo "::error::gofmt issues:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Vulncheck (fails on new vulnerabilities - bump deps/toolchain to fix)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ~/go/bin/govulncheck ./...

      - name: Test
        run: go test ./... -v
      - name: Build
        run: go build ./...
